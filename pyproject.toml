[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-organizer"
version = "1.0.0"
description = "Organizador multiplataforma de imagens ISO por regras de nome"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ISO Organizer contributors"}]

[project.scripts]
iso-organizer = "iso_organizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

